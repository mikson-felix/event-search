[project]
name = "event-search"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mikson Felix", email = "mikson.f@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "azure-storage-blob>=12.30.1",
    "click>=8.5.0",
    "duckdb>=1.5.5",
    "orjson>=3.12.0",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pytz>=2026.3.post1",
    "rich>=15.0.0",
    "tzlocal>=5.4.4",
]

[project.scripts]
event-search = "event_search.cli.main:cli"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
]


[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src"]

exclude = [
    ".git",
    ".venv",
    ".cache",
    "build",
    "dist",
]


[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "SIM",
    "C4",
    "PIE",
    "RUF",
]

ignore = []


[tool.ruff.lint.isort]
known-first-party = ["event_search"]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
testpaths = ["tests"]

addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--cov=event_search",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=90",
]   
